<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regi • Mahasiswa & Freelance</title>
    <meta name="description" content="Portofolio Regi, mahasiswa Fakultas Hukum UNNES yang aktif di bidang akademik dan pemrograman.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --latar: #faf7f2;
            --teks: #1f1d1a;
            --redup: #6f6a62;
            --garis: #e6e0d6;
            --aksen: #e4572e;
            --sorot: #ffe9a8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            background: var(--latar);
            color: var(--teks);
            line-height: 1.65;
        }

        main { max-width: 720px; margin: 0 auto; padding: 72px 24px 48px; }

        /* Pembuka */
        .foto {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--aksen);
            margin-bottom: 28px;
            display: block;
        }

        .label {
            color: var(--aksen);
            font-weight: 500;
            font-size: 15px;
            margin-bottom: 12px;
        }

        h1 {
            font-family: "DM Serif Display", Georgia, serif;
            font-weight: 400;
            font-size: clamp(38px, 8vw, 60px);
            line-height: 1.08;
            letter-spacing: -1px;
        }
        h1 mark { background: var(--sorot); color: inherit; padding: 0 6px; }

        .intro {
            margin-top: 22px;
            max-width: 540px;
            color: var(--redup);
            font-size: 18px;
        }

        .aksi { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
        .tombol {
            text-decoration: none;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1.5px solid var(--teks);
            color: var(--teks);
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .tombol.utama { background: var(--teks); color: var(--latar); }
        .tombol:hover { background: var(--aksen); border-color: var(--aksen); color: #fff; }

        /* Bagian isi */
        h2 {
            margin-top: 64px;
            padding-bottom: 12px;
            border-bottom: 1.5px solid var(--teks);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .baris {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 0;
            border-bottom: 1px solid var(--garis);
